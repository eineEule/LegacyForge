[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacyforge"
version = "0.2.0"
description = "Evidence-driven compatibility engine for legacy 32-bit Windows PC games."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
registry = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42"]

[project.scripts]
legacyforge = "legacyforge.cli:main"
oldgames = "legacyforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legacyforge = ["recipes/*.yaml", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: needs a real game install (excluded by default)"]
addopts = "-m 'not integration'"
