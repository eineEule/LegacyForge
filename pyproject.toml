[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oldgames"
version = "0.1.0"
description = "Patch and wrap old 32-bit PC games with small, reviewable recipes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pefile>=2023.2.7"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oldgames = "oldgames.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oldgames = ["recipes/*.yaml", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
