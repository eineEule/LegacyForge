known_issues:
  - id: renderer-d3dgl
    summary: "Renders through d3dgl.dll (named for a GL-on-Direct3D layer), which imports Direct3D 11; riseofnations.exe loads it at runtime rather than importing it."
    evidence: "legacyforge analyze on steam-ee build 00.2009.09.1500UO, 2026-11-25: d3dgl.dll imports d3d11.dll; the exe imports no graphics API directly."
    status: confirmed
  - id: patriots-launcher
    summary: "patriots.exe (2.3 MB, MFC + GDI+ + steam_api, default 'TODO' version strings) is a launcher/dialog, not the renderer."
    evidence: "legacyforge analyze, 2026-11-25 (sha256 833fa691...eb8156)."
    status: confirmed
  - id: nvidia-driver-2025
    summary: "DirectX errors halting the game on some 2025 Nvidia drivers."
    evidence: "r/riseofnations help thread (March 2025): rolling back from 572.83 to 566.36 fixed it for one user. Not reproduced."
    status: unconfirmed
  - id: multiplayer-lobbies
    summary: "Online lobbies failing to load after game updates."
    evidence: "Steam discussions after the June 2024 update; workaround reported: Steam download region set to a 'LAN EVENT' region."
    status: unconfirmed

fixes:
  - laa: riseofnations.exe
    status: suggested
    order: 1
    note: "community-recommended for crashes; needs --approve laa until a tested hash is recorded"
  - dxvk: {api: d3d11}
    optional: true
    status: experimental
    order: 2
    note: "renderer is d3dgl.dll on Direct3D 11; A/B test with sessions before keeping"

test_plan:
  - id: skirmish-late
    duration_minutes: 60
    steps: ["Huge map, 8 players, play into the Information Age", "Record with: legacyforge launch rise-of-nations-ee --scenario skirmish-late"]
    pass_criteria: "No crash for the full duration"

evidence: []
notes:
  - "Subscribe to the Community Balance/Bugfix Patch (CBP) on the Steam Workshop."
  - "patriots.exe is a small launcher (default 'TODO' version strings, no renderer); fixes belong on riseofnations.exe."
  - "Multiplayer fallback: a virtual LAN (Tailscale/ZeroTier)."
