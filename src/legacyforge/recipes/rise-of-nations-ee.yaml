    sha256:
      - 30478a44b577cb11ebcbbbf53d3e93ba02fd2aacf3bdefa6552c9b6449625079
    notes: "Hash recorded 2026-11-25 from a Steam install on Windows 11. 32-bit, not Large Address Aware, unsigned, no protection sections detected; renderer not in the exe's own imports."
supported_windows: ["10", "11"]

known_issues:
  - id: renderer-d3dgl
    summary: "Renders with Direct3D 11 through d3dgl.dll (game folder), which the exe loads at runtime. Direct3D 7 (D3DIM700.DLL) is also loaded; purpose unknown."
    evidence: "2026-11-25, steam-ee build 00.2009.09.1500UO at the main menu: running process loaded d3dgl.dll, D3DCOMPILER_47.dll (game folder), d3d11.dll, dxgi.dll, D3DIM700.DLL (System32). Seen with 32-bit PowerShell; 64-bit PowerShell hides a WOW64 process's 32-bit modules."
    status: confirmed
  - id: memory-at-menu
    summary: "Uses about 0.7 GB (working set) at the main menu, against a 2 GiB address-space limit."
    evidence: "2026-11-25: riseofnations.exe working set 692 MB at the main menu (Get-Process). Peak in a late-game match not yet measured."
    status: observed
  - id: patriots-launcher
    summary: "patriots.exe (2.3 MB, MFC + GDI+ + steam_api, default 'TODO' version strings) is the Play/Achievements/Workshop launcher; it starts riseofnations.exe and exits."
    evidence: "legacyforge analyze (sha256 833fa691...eb8156) and observed 2026-11-25: patriots.exe at 58 MB showing the launcher, replaced by riseofnations.exe after Play."
    status: confirmed
  - id: nvidia-driver-2025
    summary: "DirectX errors halting the game on some 2025 Nvidia drivers."
    evidence: "r/riseofnations help thread (March 2025): rolling back from 572.83 to 566.36 fixed it for one user. Not reproduced."
    status: unconfirmed
  - id: multiplayer-lobbies
    summary: "Online lobbies failing to load after game updates."
    evidence: "Steam discussions after the June 2024 update; workaround reported: Steam download region set to a 'LAN EVENT' region."
    status: unconfirmed

fixes:
  - laa: riseofnations.exe
    status: suggested
    order: 1
    note: "community-recommended for crashes; needs --approve laa until a tested hash is recorded"
  - dxvk: {api: d3d11}
    optional: true
    status: experimental
    order: 2
    note: "renderer is Direct3D 11 (d3dgl.dll); A/B test with sessions before keeping"

test_plan:
  - id: skirmish-late
    duration_minutes: 60
    steps: ["Huge map, 8 players, play into the Information Age", "Record with: legacyforge launch rise-of-nations-ee --scenario skirmish-late"]
    pass_criteria: "No crash for the full duration"

evidence: []
notes:
  - "Subscribe to the Community Balance/Bugfix Patch (CBP) on the Steam Workshop."
  - "patriots.exe is a small launcher (default 'TODO' version strings, no renderer); fixes belong on riseofnations.exe."
  - "Multiplayer fallback: a virtual LAN (Tailscale/ZeroTier)."
