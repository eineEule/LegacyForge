    evidence: "CivFanatics thread '4gb patch for civ 4' (threads/4gb-patch-for-civ-4.623834). Confirm with `legacyforge analyze`."
    source: "https://forums.civfanatics.com/threads/4gb-patch-for-civ-4.623834/"
    status: unconfirmed

