game: civ5
name: "Sid Meier's Civilization V"
detect:
  steam_appid: 8930
  exe: CivilizationV_DX11.exe

fixes:
  # Usually already set by the official patches; the fix is a no-op then.
  - laa: [CivilizationV.exe, CivilizationV_DX11.exe]

  # 8x MSAA eats into the 4 GB budget that long late-game sessions need.
  - ini:
      file: "${DOCUMENTS}/My Games/Sid Meier's Civilization 5/GraphicsSettingsDX11.ini"
      set:
        UserSettings: {MSAASamples: 2}

  # Keep logs so the next crash leaves evidence.
  - ini:
      file: "${DOCUMENTS}/My Games/Sid Meier's Civilization 5/config.ini"
      set:
        "*": {LoggingEnabled: 1}
    optional: true
    note: "turns on game logging"

  # Vulkan translation; can ease stutter and driver memory use. Test it.
  - dxvk: {api: d3d11, exe: CivilizationV_DX11.exe}
    optional: true

notes:
  - "Launch the DirectX 11 version from Steam's launch menu."
  - "Civ V is 32-bit: the ceiling is 4 GB no matter what. On huge maps or 30+ civs, save and restart every 2-3 hours."
